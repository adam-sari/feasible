[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feasible"
version = "0.1.0"
description = "Feasible — Constraint Intelligence Engine: demo loop v1 (Build A verified spine)"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10,<9.13",
    "z3-solver>=4.12",
    "pydantic>=2",
    "openpyxl",
    "pandas",
    "pdfplumber",
    "markdown-it-py",
    "typer",
    "cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis", "mypy"]
# Pre-seeded for the forked tracks so neither Track A (React/web console) nor
# Track C (gemini extraction) edits pyproject post-fork — kills the only A-vs-C
# shared file. The trust core depends on NEITHER extra.
web = ["fastapi", "uvicorn[standard]", "httpx"]
extract = ["google-genai", "python-dotenv"]

[project.scripts]
feasible = "feasible.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["feasible"]

[tool.pytest.ini_options]
testpaths = ["spikes", "tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["ortools.*", "z3", "openpyxl.*", "pandas", "pdfplumber", "markdown_it.*"]
ignore_missing_imports = true

# Pre-seeded track deps (the `web` + `extract` extras) — overrides so a track that
# imports them types clean without editing pyproject post-fork.
[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "httpx.*", "google.genai.*", "dotenv.*"]
ignore_missing_imports = true
